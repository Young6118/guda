[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "global-user-data-analysis"
version = "0.1.0"
description = "Evidence-backed user demand and source intelligence platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
]

[project.scripts]
guda = "guda.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guda"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
