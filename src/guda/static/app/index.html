<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GUDA Intelligence</title>
  <link rel="stylesheet" href="assets/app.css?v=20260730-5" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p>GUDA Intelligence</p>
        <h1>需求情报工作台</h1>
      </div>
      <nav><a href="../admin/">Admin</a><button id="refresh" type="button">刷新</button></nav>
    </header>
    <section class="hero-bar">
      <label>Topic Pack<select id="topic-pack-select"></select></label>
      <span id="topic-pack-meta" class="muted">选择一个主题包查看 dashboard</span>
    </section>
    <section id="metrics" class="metrics"></section>
    <section id="dashboard" class="dashboard"></section>
    <section id="trends" class="trend-grid"></section>
    <section class="layout">
      <aside class="filters">
        <h2>筛选</h2>
        <form id="filters">
          <label>关键词<input name="q" value="agent" /></label>
          <label>平台<select name="platform"><option value="">全部</option></select></label>
          <label>类型<select name="item_type"><option value="">全部</option></select></label>
          <label>语言<select name="language"><option value="">全部</option></select></label>
          <label>排序<select name="sort"><option value="fetched_at">抓取时间</option><option value="created_at_source">源发布时间</option><option value="platform">平台</option><option value="item_type">类型</option></select></label>
          <button>应用</button>
        </form>
        <div id="coverage"></div>
      </aside>
      <section class="content">
        <div class="panel"><div class="panel-head"><h2>证据流</h2><span id="page-meta"></span></div><div id="evidence"></div><div class="pager"><button id="prev">上一页</button><button id="next">下一页</button></div></div>
      </section>
      <aside id="detail" class="detail"><h2>证据详情</h2><div class="muted">选择一条证据查看引用和原文。</div></aside>
    </section>
  </main>
  <script src="assets/app.js?v=20260730-5"></script>
</body>
</html>
